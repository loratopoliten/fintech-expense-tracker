<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — FinTrack</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#080a0d; --surface:#0f1117; --border:#1c2030; --accent:#f0a500; --text:#e2e6f0; --muted:#5a6278; --red:#f04f4f; --red-dim:#4d1515; }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Syne',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:2.5rem; width:100%; max-width:440px; }
    .logo { font-size:1.6rem; font-weight:800; color:var(--accent); margin-bottom:0.25rem; }
    .logo span { color:var(--text); }
    h2 { font-size:1.25rem; font-weight:800; margin:1.25rem 0 0.25rem; }
    .sub { font-size:0.82rem; color:var(--muted); font-family:'DM Mono',monospace; margin-bottom:1.75rem; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:0.85rem; }
    .form-group { margin-bottom:1rem; }
    label { display:block; font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); margin-bottom:0.35rem; }
    input { width:100%; padding:0.65rem 0.9rem; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:'DM Mono',monospace; font-size:0.9rem; }
    input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(240,165,0,0.1); }
    .btn { width:100%; padding:0.75rem; background:var(--accent); color:#000; border:none; border-radius:8px; font-family:'Syne',sans-serif; font-weight:800; font-size:0.95rem; cursor:pointer; margin-top:0.5rem; transition:all 0.15s; }
    .btn:hover { background:#ffc82d; transform:translateY(-1px); }
    .alert { padding:0.7rem 1rem; border-radius:8px; margin-bottom:0.75rem; font-size:0.85rem; background:var(--red-dim); border:1px solid rgba(240,79,79,0.3); color:var(--red); }
    .footer-link { text-align:center; margin-top:1.25rem; font-size:0.83rem; color:var(--muted); }
    .footer-link a { color:var(--accent); font-weight:600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Fin<span>Track</span></div>
    <h2>Create account</h2>
    <div class="sub">takes 30 seconds</div>
    {% if errors %}{% for e in errors %}<div class="alert">{{ e }}</div>{% endfor %}{% endif %}
    <form method="POST" action="/auth/register">
      <div class="form-row">
        <div class="form-group">
          <label>Username</label>
          <input type="text" name="username" value="{{ username or '' }}" required autofocus minlength="3">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" value="{{ email or '' }}" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" required minlength="6">
        </div>
        <div class="form-group">
          <label>Confirm</label>
          <input type="password" name="confirm" required>
        </div>
      </div>
      <button type="submit" class="btn">Create account →</button>
    </form>
    <div class="footer-link">Already have an account? <a href="/auth/login">Sign in</a></div>
  </div>
</body>
</html>
