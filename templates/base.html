<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}FinTrack{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #080a0d;
      --surface:   #0f1117;
      --surface2:  #161a24;
      --border:    #1c2030;
      --border2:   #252c3f;
      --accent:    #f0a500;
      --accent-dim:#7a5200;
      --green:     #1fd87a;
      --green-dim: #0a4d2e;
      --red:       #f04f4f;
      --red-dim:   #4d1515;
      --blue:      #4f8ef0;
      --text:      #e2e6f0;
      --muted:     #5a6278;
      --muted2:    #3a4055;
      --radius:    12px;
      --radius-sm: 8px;
    }
    body.light-mode {
      --bg: #f6f7fb;
      --surface: #ffffff;
      --surface2: #edf0f6;
      --border: #dfe3ec;
      --border2: #c8cedb;
      --text: #161a24;
      --muted: #687083;
      --muted2: #9299a8;
      --green-dim: #dff8eb;
      --red-dim: #ffe4e4;
      --accent-dim: #f9df9c;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Syne', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; line-height: 1.5; }
    a { color: var(--accent); text-decoration: none; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

    /* ── Layout ── */
    .layout { display: flex; min-height: 100vh; }

    /* ── Sidebar ── */
    .sidebar {
      width: 230px; flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      padding: 0; position: sticky; top: 0; height: 100vh; overflow-y: auto;
    }
    .sidebar-logo {
      padding: 1.75rem 1.5rem 1.25rem;
      font-size: 1.35rem; font-weight: 800; letter-spacing: -0.03em;
      color: var(--accent); display: flex; align-items: center; gap: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-logo span { color: var(--text); }
    .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{ opacity:1; } 50%{ opacity:0.3; } }

    .nav-section { padding: 1.25rem 0 0.5rem; }
    .nav-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted2); padding: 0 1.5rem; margin-bottom: 0.25rem; }
    .nav-item {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.65rem 1.5rem; color: var(--muted);
      font-size: 0.88rem; font-weight: 600;
      border-left: 3px solid transparent; transition: all 0.15s;
      position: relative;
    }
    .nav-item:hover { color: var(--text); background: rgba(255,255,255,0.03); }
    .nav-item.active { color: var(--accent); border-left-color: var(--accent); background: rgba(240,165,0,0.07); }
    .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .sidebar-footer {
      margin-top: auto; padding: 1.25rem 1.5rem;
      border-top: 1px solid var(--border);
    }
    .user-badge {
      display: flex; align-items: center; gap: 0.65rem;
      margin-bottom: 0.85rem;
    }
    .user-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-dim));
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; font-weight: 800; color: #000; flex-shrink: 0;
    }
    .user-name { font-size: 0.85rem; font-weight: 700; }
    .logout-btn {
      width: 100%; padding: 0.5rem; background: transparent;
      border: 1px solid var(--border2); color: var(--muted);
      border-radius: var(--radius-sm); font-size: 0.8rem;
      font-family: 'Syne', sans-serif; cursor: pointer; transition: all 0.15s;
    }
    .logout-btn:hover { border-color: var(--red); color: var(--red); }

    /* ── Main content ── */
    .main { flex: 1; padding: 2rem 2.5rem; overflow-x: hidden; max-width: 1200px; }

    .page-header { margin-bottom: 2rem; }
    .page-title { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.03em; }
    .page-sub { color: var(--muted); font-size: 0.83rem; font-family: 'DM Mono', monospace; margin-top: 0.2rem; }

    /* ── Cards ── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.5rem;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: var(--border2); }
    .card-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 0.5rem; }
    .card-value { font-size: 2rem; font-weight: 800; letter-spacing: -0.03em; font-family: 'DM Mono', monospace; }
    .card-value.green { color: var(--green); }
    .card-value.red   { color: var(--red); }
    .card-value.gold  { color: var(--accent); }
    .card-sub { font-size: 0.78rem; color: var(--muted); margin-top: 0.3rem; font-family: 'DM Mono', monospace; }

    .card-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 1.25rem; display: flex; align-items: center; justify-content: space-between; }

    /* ── Grids ── */
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1.25rem; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-bottom: 1.25rem; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1.25rem; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.55rem 1.1rem; border-radius: var(--radius-sm);
      font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.85rem;
      cursor: pointer; border: none; transition: all 0.15s; white-space: nowrap;
    }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { background: #ffc82d; transform: translateY(-1px); }
    .btn-success { background: var(--green); color: #000; }
    .btn-success:hover { background: #3dffa0; }
    .btn-danger  { background: transparent; border: 1px solid var(--red); color: var(--red); }
    .btn-danger:hover  { background: var(--red); color: #fff; }
    .btn-ghost   { background: transparent; border: 1px solid var(--border2); color: var(--muted); }
    .btn-ghost:hover   { border-color: var(--text); color: var(--text); }
    .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.78rem; }

    /* ── Forms ── */
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 0.35rem; }
    input[type="text"], input[type="email"], input[type="password"],
    input[type="number"], input[type="date"], select, textarea {
      width: 100%; padding: 0.65rem 0.9rem;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text);
      font-family: 'DM Mono', monospace; font-size: 0.88rem;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(240,165,0,0.1);
    }
    select option { background: var(--surface2); }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); padding: 0.6rem 0.9rem; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
    td { padding: 0.8rem 0.9rem; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
    tr:last-child td { border-bottom: none; }
    tbody tr { transition: background 0.1s; }
    tbody tr:hover td { background: rgba(255,255,255,0.025); }

    /* ── Badges ── */
    .badge { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.2rem 0.65rem; border-radius: 20px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
    .badge-income  { background: var(--green-dim); color: var(--green); }
    .badge-expense { background: var(--red-dim);   color: var(--red); }
    .badge::before { content:''; width:5px; height:5px; border-radius:50%; background:currentColor; }

    /* ── Progress bar ── */
    .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 3px; transition: width 1s cubic-bezier(0.4,0,0.2,1); }
    .fill-green  { background: var(--green); }
    .fill-gold   { background: var(--accent); }
    .fill-red    { background: var(--red); }

    /* ── Alert ── */
    .alert { padding: 0.8rem 1rem; border-radius: var(--radius-sm); font-size: 0.88rem; margin-bottom: 1rem; }
    .alert-success { background: var(--green-dim); border: 1px solid rgba(31,216,122,0.3); color: var(--green); }
    .alert-error   { background: var(--red-dim);   border: 1px solid rgba(240,79,79,0.3);  color: var(--red); }

    /* ── Mono amounts ── */
    .mono { font-family: 'DM Mono', monospace; }

    /* ── Empty state ── */
    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
    .empty-state p { font-size: 0.9rem; margin-bottom: 1.25rem; }

    /* ── Divider ── */
    .divider { height: 1px; background: var(--border); margin: 1.25rem 0; }

    /* ── Tooltip chip ── */
    .chip { display: inline-block; padding: 0.15rem 0.55rem; background: var(--surface2); border: 1px solid var(--border2); border-radius: 20px; font-size: 0.72rem; color: var(--muted); font-family: 'DM Mono', monospace; }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      background: var(--surface2); border: 1px solid var(--green);
      color: var(--green); padding: 0.75rem 1.25rem;
      border-radius: var(--radius-sm); font-size: 0.88rem; font-weight: 600;
      transform: translateY(100px); opacity: 0;
      transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
      z-index: 1000; pointer-events: none;
    }
    #toast.show { transform: translateY(0); opacity: 1; }

    /* ── Animations ── */
    @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    .fade-up { animation: fadeUp 0.4s ease both; }
    .fade-up-1 { animation-delay: 0.05s; }
    .fade-up-2 { animation-delay: 0.10s; }
    .fade-up-3 { animation-delay: 0.15s; }
    .fade-up-4 { animation-delay: 0.20s; }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .sidebar { display: none; }
      .main { padding: 1rem; }
      .grid-3, .grid-4 { grid-template-columns: repeat(2, 1fr); }
      .grid-2 { grid-template-columns: 1fr; }
    }
    @media (max-width: 580px) {
      .grid-3, .grid-4, .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<div class="layout">
  {% if user is defined and user %}
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-dot"></div>
      Fin<span>Track</span>
    </div>
    <nav class="nav-section">
      <div class="nav-label">Main</div>
      <a class="nav-item {% if request.url.path == '/dashboard' %}active{% endif %}" href="/dashboard">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </a>
      <a class="nav-item {% if '/transactions' in request.url.path and 'budget' not in request.url.path %}active{% endif %}" href="/transactions">
        <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        Transactions
      </a>
      <a class="nav-item {% if 'budget' in request.url.path %}active{% endif %}" href="/transactions/budgets">
        <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
        Budgets
      </a>
      <a class="nav-item {% if '/transactions/goals' in request.url.path %}active{% endif %}" href="/transactions/goals">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
        Goals
      </a>
      <a class="nav-item {% if '/scoring' in request.url.path %}active{% endif %}" href="/scoring">
        <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Health Score
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-badge">
        <div class="user-avatar">{{ user.username[0].upper() }}</div>
        <div>
          <div class="user-name">{{ user.username }}</div>
          <div style="font-size:0.72rem;color:var(--muted);font-family:'DM Mono',monospace;">active</div>
        </div>
      </div>
      <a href="/auth/logout"><button class="logout-btn">↩ Sign out</button></a>
      <button class="logout-btn" type="button" style="margin-top:0.5rem;" onclick="toggleTheme()">Toggle theme</button>
    </div>
  </aside>
  {% endif %}

  <main class="main">
    {% block content %}{% endblock %}
  </main>
</div>

<div id="toast"></div>

<script>
function showToast(msg, color) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.borderColor = color || 'var(--green)';
  t.style.color = color || 'var(--green)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
// Animate progress bars on load
document.addEventListener('DOMContentLoaded', () => {
  if (localStorage.getItem('fintrack-theme') === 'light') {
    document.body.classList.add('light-mode');
  }
  document.querySelectorAll('.progress-fill[data-width]').forEach(el => {
    const w = el.dataset.width;
    el.style.width = '0%';
    setTimeout(() => el.style.width = w + '%', 100);
  });
});
function toggleTheme() {
  document.body.classList.toggle('light-mode');
  localStorage.setItem('fintrack-theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
