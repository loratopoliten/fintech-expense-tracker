<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register — FinTrack</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0a0c0f; --surface:#111318; --border:#1e2129; --accent:#f0a500; --text:#e8eaf0; --muted:#666c7a; --red:#f04f4f; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Syne', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .wrap { width: 100%; max-width: 420px; padding: 1rem; }
    .logo { text-align: center; font-size: 2rem; font-weight: 800; color: var(--accent); margin-bottom: 0.25rem; }
    .logo span { color: var(--text); }
    .sub { text-align: center; font-size: 0.82rem; color: var(--muted); font-family: 'DM Mono', monospace; margin-bottom: 2rem; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; }
    .card h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 0.35rem; }
    input { width: 100%; padding: 0.65rem 0.9rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'DM Mono', monospace; font-size: 0.9rem; }
    input:focus { outline: none; border-color: var(--accent); }
    .btn { width: 100%; padding: 0.75rem; background: var(--accent); color: #000; border: none; border-radius: 8px; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.95rem; cursor: pointer; margin-top: 0.5rem; }
    .btn:hover { background: #ffc62d; }
    .footer-link { text-align: center; margin-top: 1.25rem; font-size: 0.85rem; color: var(--muted); }
    .footer-link a { color: var(--accent); }
    .alert { padding: 0.7rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.88rem; background: rgba(240,79,79,0.1); border: 1px solid rgba(240,79,79,0.3); color: var(--red); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">Fin<span>Track</span></div>
    <div class="sub">start tracking in 30 seconds</div>
    <div class="card">
      <h2>Create account</h2>
      {% if errors %}
        {% for e in errors %}<div class="alert">{{ e }}</div>{% endfor %}
      {% endif %}
      <form method="POST" action="/auth/register">
        <div class="form-group">
          <label>Username</label>
          <input type="text" name="username" value="{{ username or '' }}" required autofocus>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" value="{{ email or '' }}" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" required>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" name="confirm" required>
        </div>
        <button type="submit" class="btn">Create account →</button>
      </form>
    </div>
    <div class="footer-link">Already have an account? <a href="/auth/login">Sign in</a></div>
  </div>
</body>
</html>
