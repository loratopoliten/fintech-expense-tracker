<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}FinTrack{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #0a0c0f;
      --surface:  #111318;
      --border:   #1e2129;
      --accent:   #f0a500;
      --accent2:  #e05c00;
      --green:    #22c97a;
      --red:      #f04f4f;
      --text:     #e8eaf0;
      --muted:    #666c7a;
      --radius:   10px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'Syne', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Layout ── */
    .layout { display: flex; min-height: 100vh; }

    /* ── Sidebar ── */
    .sidebar {
      width: 220px; flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      padding: 1.5rem 0;
      position: sticky; top: 0; height: 100vh; overflow-y: auto;
    }
    .sidebar-logo {
      padding: 0 1.5rem 1.5rem;
      font-size: 1.3rem; font-weight: 800; letter-spacing: -0.02em;
      color: var(--accent);
    }
    .sidebar-logo span { color: var(--text); }
    .nav-item {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.65rem 1.5rem;
      color: var(--muted); font-size: 0.9rem; font-weight: 600;
      border-left: 3px solid transparent;
      transition: all 0.15s;
    }
    .nav-item:hover { color: var(--text); text-decoration: none; background: rgba(255,255,255,0.03); }
    .nav-item.active { color: var(--accent); border-left-color: var(--accent); background: rgba(240,165,0,0.06); }
    .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
    .sidebar-footer { margin-top: auto; padding: 1rem 1.5rem; }
    .logout-btn {
      display: block; width: 100%; padding: 0.5rem;
      background: transparent; border: 1px solid var(--border);
      color: var(--muted); border-radius: var(--radius);
      font-size: 0.8rem; font-family: 'Syne', sans-serif;
      cursor: pointer; text-align: center; transition: all 0.15s;
    }
    .logout-btn:hover { border-color: var(--red); color: var(--red); }

    /* ── Main ── */
    .main { flex: 1; padding: 2rem 2.5rem; overflow-x: hidden; }
    .page-title { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.25rem; }
    .page-sub   { color: var(--muted); font-size: 0.88rem; font-family: 'DM Mono', monospace; margin-bottom: 2rem; }

    /* ── Cards ── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.5rem;
    }
    .card-label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 0.4rem; }
    .card-value { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.02em; }
    .card-value.green { color: var(--green); }
    .card-value.red   { color: var(--red); }
    .card-value.gold  { color: var(--accent); }

    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-bottom: 1.5rem; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.55rem 1.1rem; border-radius: var(--radius);
      font-family: 'Syne', sans-serif; font-weight: 600; font-size: 0.88rem;
      cursor: pointer; border: none; transition: all 0.15s;
    }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { background: #ffc62d; }
    .btn-danger  { background: transparent; border: 1px solid var(--red); color: var(--red); }
    .btn-danger:hover  { background: var(--red); color: #fff; }
    .btn-ghost   { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .btn-ghost:hover   { border-color: var(--text); color: var(--text); }

    /* ── Forms ── */
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 0.35rem; }
    input, select, textarea {
      width: 100%; padding: 0.6rem 0.9rem;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text);
      font-family: 'DM Mono', monospace; font-size: 0.9rem;
      transition: border-color 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--accent);
    }
    select option { background: var(--surface); }

    /* ── Table ── */
    table { width: 100%; border-collapse: collapse; }
    th { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 0.6rem 0.8rem; border-bottom: 1px solid var(--border); text-align: left; }
    td { padding: 0.75rem 0.8rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }

    /* ── Badges ── */
    .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
    .badge-income  { background: rgba(34,201,122,0.15); color: var(--green); }
    .badge-expense { background: rgba(240,79,79,0.15);  color: var(--red); }

    /* ── Alert ── */
    .alert { padding: 0.75rem 1rem; border-radius: 6px; font-size: 0.88rem; margin-bottom: 1rem; }
    .alert-success { background: rgba(34,201,122,0.1); border: 1px solid rgba(34,201,122,0.3); color: var(--green); }
    .alert-error   { background: rgba(240,79,79,0.1);  border: 1px solid rgba(240,79,79,0.3);  color: var(--red); }

    /* ── Progress bar ── */
    .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 0.5rem; }
    .progress-fill { height: 100%; border-radius: 3px; background: var(--accent); transition: width 0.5s; }
    .progress-fill.danger { background: var(--red); }
    .progress-fill.good   { background: var(--green); }

    /* ── Monospace amounts ── */
    .mono { font-family: 'DM Mono', monospace; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { padding: 1rem; }
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
      .grid-3, .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<div class="layout">
  {% if user is defined and user %}
  <aside class="sidebar">
    <div class="sidebar-logo">Fin<span>Track</span></div>
    <nav>
      <a class="nav-item {% if request.url.path == '/dashboard' %}active{% endif %}" href="/dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a class="nav-item {% if '/transactions' in request.url.path and 'budget' not in request.url.path %}active{% endif %}" href="/transactions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        Transactions
      </a>
      <a class="nav-item {% if 'budget' in request.url.path %}active{% endif %}" href="/transactions/budgets">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
        Budgets
      </a>
      <a class="nav-item {% if '/scoring' in request.url.path %}active{% endif %}" href="/scoring">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Health Score
      </a>
    </nav>
    <div class="sidebar-footer">
      <span style="font-size:0.75rem;color:var(--muted);display:block;margin-bottom:0.5rem;">{{ user.username }}</span>
      <a href="/auth/logout"><button class="logout-btn">Sign out</button></a>
    </div>
  </aside>
  {% endif %}
  <main class="main">
    {% block content %}{% endblock %}
  </main>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
